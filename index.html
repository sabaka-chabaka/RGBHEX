<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RGB to HEX Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <h1>RGB to HEX Converter</h1>
        <div class="box">
            <input type="text" id="r" placeholder="Enter R">
            <input type="text" id="g" placeholder="Enter G">
            <input type="text" id="b" placeholder="Enter B">
        </div>
        <div class="box">
            <input type="text" id="hex" placeholder="Hex Value" readonly>
        </div>
        <button id="convert">Convert</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
